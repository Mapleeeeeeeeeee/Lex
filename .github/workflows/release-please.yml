name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-attach:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Import Signing Certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          echo "$SIGNING_CERTIFICATE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -s build.keychain login.keychain-db
          rm /tmp/cert.p12
          SIGN_HASH=$(security find-identity build.keychain | grep -v "identities found" | head -1 | awk '{print $2}')
          echo "SIGN_HASH=$SIGN_HASH" >> "$GITHUB_ENV"
          echo "Found identity: $SIGN_HASH"

      - name: Build Application
        run: |
          make build SIGN_IDENTITY="$SIGN_HASH"

      - name: Verify Sparkle Bundle
        run: |
          make verify-sparkle
          
      - name: Debug Upload Lex.app
        uses: actions/upload-artifact@v4
        with:
          name: debug-lex-app
          path: Lex.app/
          
      - name: Create ZIP Archive
        run: |
          make zip
          
      - name: Create DMG Image
        run: |
          make dmg
          
      - name: Generate Sparkle Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          make appcast
          
      - name: Commit Appcast to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add docs/appcast.xml
          git commit -m "chore: update appcast.xml for release ${{ needs.release-please.outputs.tag_name }}" || echo "No changes to commit"
          git push origin main
          
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            Lex.dmg
            Lex.app.zip
